AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Assistant technicien, scenario 1 : Managed Knowledge Base Amazon Bedrock + appel Converse.
  Cree le bucket de documentation, la Knowledge Base managee, sa source S3, un garde-fou
  d'ancrage et la politique IAM minimale a attacher au role de l'application.

Parameters:
  ProjectName:
    Type: String
    Default: techassist-rag
    AllowedPattern: "[a-z0-9-]{3,30}"
  ModelId:
    Type: String
    Default: eu.anthropic.claude-haiku-4-5-20251001-v1:0
    AllowedPattern: "eu\\..+"
    Description: Profil d'inference europeen (prefixe eu.) utilise par l'application.
  GroundingThreshold:
    Type: Number
    Default: 0.7
    MinValue: 0
    MaxValue: 0.99
    Description: Seuil d'ancrage du garde-fou. Plus il est haut, plus les reponses peu fondees sont bloquees.

Resources:
  # ---------- Documentation source ----------
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: project
          Value: !Ref ProjectName

  DocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocsBucket.Arn
              - !Sub "${DocsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------- Knowledge Base managee ----------
  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
      Policies:
        - PolicyName: read-documentation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocsBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DocsBucket.Arn}/*"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub "${ProjectName}-kb"
      Description: Documentation technique fournisseurs (notices, codes defauts, procedures)
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: MANAGED
        ManagedKnowledgeBaseConfiguration:
          # Modele d'embedding, stockage et recherche hybride geres par le service.
          EmbeddingModelType: MANAGED
      Tags:
        project: !Ref ProjectName

  DocsDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !GetAtt KnowledgeBase.KnowledgeBaseId
      Name: !Sub "${ProjectName}-s3-docs"
      DataDeletionPolicy: DELETE
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt DocsBucket.Arn
          InclusionPrefixes:
            - docs/

  # ---------- Garde-fou d'ancrage ----------
  GroundingGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "${ProjectName}-grounding"
      Description: Bloque les reponses non fondees sur la documentation ou hors sujet
      BlockedInputMessaging: Je ne peux pas traiter cette demande.
      BlockedOutputsMessaging: Je ne peux pas donner de reponse fiable a partir de la documentation disponible.
      ContextualGroundingPolicyConfig:
        FiltersConfig:
          - Type: GROUNDING
            Threshold: !Ref GroundingThreshold
          - Type: RELEVANCE
            Threshold: 0.5
      Tags:
        - Key: project
          Value: !Ref ProjectName

  GroundingGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt GroundingGuardrail.GuardrailId
      Description: Version initiale

  # ---------- Permissions de l'application (moindre privilege) ----------
  ApplicationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: A attacher au role IAM qui execute l'application (EC2, ECS, Lambda)
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RetrieveFromKnowledgeBase
            Effect: Allow
            Action: bedrock:Retrieve
            Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn
          - Sid: InvokeEuropeanInferenceProfile
            Effect: Allow
            Action: bedrock:InvokeModel
            Resource:
              - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}"
              # Un profil eu. route vers les regions europeennes uniquement.
              - !Sub
                - "arn:${AWS::Partition}:bedrock:eu-*::foundation-model/${BaseModel}"
                - BaseModel: !Select [1, !Split ["eu.", !Ref ModelId]]
          - Sid: ApplyGroundingGuardrail
            Effect: Allow
            Action: bedrock:ApplyGuardrail
            Resource: !GetAtt GroundingGuardrail.GuardrailArn

Outputs:
  DocsBucketName:
    Value: !Ref DocsBucket
  KnowledgeBaseId:
    Value: !GetAtt KnowledgeBase.KnowledgeBaseId
  DataSourceId:
    Value: !GetAtt DocsDataSource.DataSourceId
  GuardrailId:
    Value: !GetAtt GroundingGuardrail.GuardrailId
  GuardrailVersion:
    Value: !GetAtt GroundingGuardrailVersion.Version
  ApplicationPolicyArn:
    Value: !Ref ApplicationPolicy
  ModelId:
    Value: !Ref ModelId
