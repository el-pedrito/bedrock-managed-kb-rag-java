# API sans authentification : ecoute en local uniquement par defaut. Ne l'exposer (SERVER_ADDRESS)
# que derriere l'authentification du backend.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: bedrock-managed-kb-rag
  ai:
    bedrock:
      aws:
        region: ${AWS_REGION:eu-west-1}
    # Le modele et ses options sont fixes dans AwsClientsConfig a partir de techassist.model-id.

techassist:
  region: ${AWS_REGION:eu-west-1}
  knowledge-base-id: ${KNOWLEDGE_BASE_ID}
  # Profil d'inference europeen : l'inference reste dans les regions AWS en Europe.
  model-id: ${MODEL_ID:eu.anthropic.claude-haiku-4-5-20251001-v1:0}
  # Controle d'ancrage actif par defaut : sans GUARDRAIL_ID/VERSION, l'application refuse de demarrer.
  grounding-check: ${GROUNDING_CHECK:true}
  guardrail-id: ${GUARDRAIL_ID:}
  guardrail-version: ${GUARDRAIL_VERSION:}
  max-results: ${MAX_RESULTS:5}
  max-tokens: ${MAX_TOKENS:800}

management:
  endpoints:
    web:
      exposure:
        include: health
